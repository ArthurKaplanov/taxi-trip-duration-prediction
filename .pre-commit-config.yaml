fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
  - repo: local
    hooks:
      - &default_hook
        id: default
        name: default
        entry: uv run python -c "print('No entry for default hook')"
        files: &files ^(src|tests)/
        args: &paths_list
          - src
          - tests
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - <<: *default_hook
        id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        args: *paths_list

      - <<: *default_hook
        id: ruff-format
        name: ruff format
        entry: uv run ruff format
        args: *paths_list
