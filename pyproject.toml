[project]
name = "taxi-trip-duration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "catboost>=1.2.5",
    "dvc[s3]>=3.67.1",
    "fastparquet>=2026.9.0",
    "loguru>=0.7.3",
    "mlflow>=3.17.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pre-commit>=4.6.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
# Включаем дефолтные правила (E, F) + сортировку импортов (I)
select = ["E", "F", "I"]
