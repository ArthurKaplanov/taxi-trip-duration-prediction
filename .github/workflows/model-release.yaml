
name: Taxi Model Release

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "MLflow Model Registry version"
        required: true
        type: string

      deploy:
        description: "Deploy verified image to Kubernetes"
        required: true
        type: boolean
        default: false

      check_k8s:
        description: "Check Kubernetes access without deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: taxi-model-release
  cancel-in-progress: false

jobs:
  model-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      MODEL_NAME: taxi_trip_prediction_model
      MODEL_VERSION: ${{ inputs.model_version }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_S3_ENDPOINT_URL: https://storage.yandexcloud.net

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1

      YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
      IMAGE_REPOSITORY: taxi-prediction

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      # Download the exact model version, not the Champion alias.
      - name: Download MLflow model
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          import mlflow
          from mlflow import MlflowClient

          model_name = os.environ["MODEL_NAME"]
          model_version = os.environ["MODEL_VERSION"]
          model_uri = f"models:/{model_name}/{model_version}"

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])

          client = MlflowClient()
          registered = client.get_model_version(
              name=model_name,
              version=model_version,
          )

          print(f"Model URI: {model_uri}")
          print(f"Model run ID: {registered.run_id}")

          downloaded = Path(
              mlflow.artifacts.download_artifacts(
                  artifact_uri=model_uri
              )
          )

          destination = Path("models")
          if destination.exists():
              shutil.rmtree(destination)

          shutil.copytree(downloaded, destination)

          if not (destination / "MLmodel").is_file():
              raise RuntimeError("Missing MLmodel file")

          if not (destination / "model.cb").is_file():
              raise RuntimeError("Missing CatBoost artifact")

          print("MLflow model successfully downloaded")
          PY


      - name: Verify deployment approval
        if: ${{ inputs.deploy }}
        run: |
          uv run --no-sync python - <<'PY'
          import os

          import mlflow
          from mlflow import MlflowClient

          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          client = MlflowClient()

          version = client.get_model_version(
              name=os.environ["MODEL_NAME"],
              version=os.environ["MODEL_VERSION"],
          )

          quality_gate = version.tags.get("quality_gate")
          dataset_scope = version.tags.get("dataset_scope")

          if quality_gate not in ("approved", "initial_candidate"):
              raise RuntimeError(
                  f"Model version {version.version} is not approved: "
                  f"{quality_gate}"
              )

          if dataset_scope != "production":
              raise RuntimeError(
                  "Deployment blocked: model was not evaluated "
                  "on an approved production dataset"
              )

          print(
              f"Model v{version.version} passed release checks"
          )
          PY

      - name: Record release metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          model_dir = Path("models")

          files = {}
          for path in sorted(model_dir.rglob("*")):
              if path.is_file():
                  files[str(path.relative_to(model_dir))] = (
                      hashlib.sha256(path.read_bytes()).hexdigest()
                  )

          manifest = {
              "model_name": os.environ["MODEL_NAME"],
              "model_version": os.environ["MODEL_VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "model_files_sha256": files,
          }

          Path("release-manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Set image tag
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/${IMAGE_REPOSITORY}:model-v${MODEL_VERSION}-${SHORT_SHA}"

          echo "tag=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Taxi Zone Lookup from DVC
        run: |
          uv run --no-sync dvc pull data/raw/taxi_zone_lookup.csv.dvc

          test -f data/raw/taxi_zone_lookup.csv

          echo "Taxi Zone Lookup restored successfully"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=model-v${{ inputs.model_version }}

      - name: Start container
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker run -d \
            --name taxi-prediction-test \
            -p 8000:8000 \
            -e MODEL_URI=/app/models \
            "$IMAGE_TAG"

      - name: Smoke test
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          import time
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          container_name = "taxi-prediction-test"

          for attempt in range(60):
              status = subprocess.run(
                  [
                      "docker", "inspect",
                      "-f", "{{.State.Running}}",
                      container_name,
                  ],
                  capture_output=True,
                  text=True,
              )

              if status.stdout.strip() != "true":
                  subprocess.run(["docker", "logs", container_name])
                  raise RuntimeError("Container exited during startup")

              try:
                  with urllib.request.urlopen(
                      f"{base_url}/health",
                      timeout=3,
                  ) as response:
                      health = json.load(response)

                  if health.get("model_loaded") is True:
                      print("Health check passed", flush=True)
                      break

              except OSError as exc:
                  print(
                      f"Health attempt {attempt + 1}: {exc}",
                      flush=True,
                  )

              time.sleep(2)

          else:
              subprocess.run(["docker", "logs", container_name])
              raise RuntimeError("Service failed health check")

          payload = {
              "PULocationID": 76,
              "DOLocationID": 161,
              "request_datetime": "2026-05-15T08:30:00",
              "hvfhs_license_num": "HV0003",
              "shared_request_flag": "N",
              "wav_request_flag": "N",
          }

          request = urllib.request.Request(
              f"{base_url}/predict",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
          ) as response:
              prediction = json.load(response)

          duration = prediction["predicted_duration_sec"]

          assert isinstance(duration, (float, int))
          assert math.isfinite(duration)
          assert duration > 0

          print("Prediction smoke test passed:", prediction)
          PY

      - name: Diagnose container on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a

          echo "=== Container state ==="
          docker inspect taxi-prediction-test \
            --format '{{json .State}}' || true

          echo "=== Application logs ==="
          docker logs --tail 150 taxi-prediction-test || true

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Push verified image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"


      - name: Install kubectl
        if: ${{ inputs.deploy }}
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Configure Kubernetes access
        if: ${{ inputs.deploy }}
        env:
          KUBECONFIG_B64: ${{ secrets.K8S_KUBECONFIG_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          chmod 700 "$RUNNER_TEMP/kube"

          printf '%s' "$KUBECONFIG_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/kube/config"

          chmod 600 "$RUNNER_TEMP/kube/config"

          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" \
            >> "$GITHUB_ENV"

          kubectl auth can-i patch deployments \
            -n taxi-ml


      - name: Deploy and verify model
        if: ${{ inputs.deploy == true }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          NAMESPACE="taxi-ml"
          DEPLOYMENT="taxi-prediction"
          CONTAINER="taxi-prediction"
          SERVICE="taxi-prediction"

          PORT_FORWARD_PID=""
          DEPLOY_STARTED=false

          echo "=== Deployment configuration ==="

          kubectl get deployment "$DEPLOYMENT" \
            -n "$NAMESPACE"

          # Save the exact image currently deployed.
          PREVIOUS_IMAGE=$(
            kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='$CONTAINER')].image}"
          )

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: Previous image not found"
            exit 1
          fi

          echo "Previous image: $PREVIOUS_IMAGE"
          echo "Candidate image: $IMAGE_TAG"

          # Preserve the current MLflow Champion.
          PREVIOUS_CHAMPION=$(
            uv run --no-sync python - <<'PY'
          import os
          import mlflow
          from mlflow import MlflowClient
          from mlflow.exceptions import MlflowException

          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          client = MlflowClient()

          try:
              champion = client.get_model_version_by_alias(
                  name=os.environ["MODEL_NAME"],
                  alias="Champion",
              )
              print(champion.version)
          except MlflowException as exc:
              if "not found" in str(exc).lower():
                  print("")
              else:
                  raise
          PY
          )

          echo "Previous Champion: ${PREVIOUS_CHAMPION:-none}"

          cleanup() {
            if [ -n "$PORT_FORWARD_PID" ]; then
              kill "$PORT_FORWARD_PID" 2>/dev/null || true
              wait "$PORT_FORWARD_PID" 2>/dev/null || true
            fi
          }

          handle_exit() {
            local exit_code=$?

            trap - EXIT
            cleanup

            if [ "$exit_code" -ne 0 ] &&
               [ "$DEPLOY_STARTED" = true ]; then

              echo "ERROR: Release failed."
              echo "Restoring previous deployment image..."

              kubectl set image \
                "deployment/$DEPLOYMENT" \
                "$CONTAINER=$PREVIOUS_IMAGE" \
                -n "$NAMESPACE" || true

              kubectl rollout status \
                "deployment/$DEPLOYMENT" \
                -n "$NAMESPACE" \
                --timeout=300s || true

              echo "Rollback attempt completed."
            fi

            exit "$exit_code"
          }

          trap handle_exit EXIT

          echo "=== Deploying candidate image ==="

          DEPLOY_STARTED=true

          kubectl set image \
            "deployment/$DEPLOYMENT" \
            "$CONTAINER=$IMAGE_TAG" \
            -n "$NAMESPACE"

          echo "=== Waiting for rollout ==="

          kubectl rollout status \
            "deployment/$DEPLOYMENT" \
            -n "$NAMESPACE" \
            --timeout=300s

          echo "=== Verifying deployed image ==="

          ACTUAL_IMAGE=$(
            kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='$CONTAINER')].image}"
          )

          if [ "$ACTUAL_IMAGE" != "$IMAGE_TAG" ]; then
            echo "ERROR: Unexpected deployed image"
            exit 1
          fi

          echo "=== Starting port-forward ==="

          kubectl port-forward \
            -n "$NAMESPACE" \
            "svc/$SERVICE" \
            18000:80 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &

          PORT_FORWARD_PID=$!

          echo "=== Running API smoke tests ==="

          python - <<'PY'
          import json
          import math
          import time
          import urllib.request

          BASE_URL = "http://127.0.0.1:18000"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      f"{BASE_URL}/health",
                      timeout=3,
                  ) as response:
                      health = json.load(response)

                  if (
                      response.status == 200
                      and health.get("model_loaded") is True
                  ):
                      print("Health check passed")
                      break

              except OSError as exc:
                  print(
                      f"Health attempt {attempt + 1}: {exc}",
                      flush=True,
                  )

              time.sleep(2)

          else:
              raise RuntimeError(
                  "Kubernetes health check failed"
              )

          payload = {
              "PULocationID": 76,
              "DOLocationID": 161,
              "request_datetime": "2026-05-15T08:30:00",
              "hvfhs_license_num": "HV0003",
              "shared_request_flag": "N",
              "wav_request_flag": "N",
          }

          request = urllib.request.Request(
              f"{BASE_URL}/predict",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
          ) as response:
              prediction = json.load(response)

          duration = prediction[
              "predicted_duration_sec"
          ]

          if not (
              isinstance(duration, (int, float))
              and math.isfinite(duration)
              and duration > 0
          ):
              raise RuntimeError(
                  "Invalid model prediction"
              )

          print(
              "Kubernetes prediction smoke test passed:",
              prediction,
          )
          PY

          echo "=== Promoting MLflow Champion ==="

          uv run --no-sync python - <<'PY'
          import os

          import mlflow
          from mlflow import MlflowClient

          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          client = MlflowClient()

          model_name = os.environ["MODEL_NAME"]
          model_version = os.environ["MODEL_VERSION"]

          candidate = client.get_model_version(
              name=model_name,
              version=model_version,
          )

          if candidate.tags.get("quality_gate") not in (
              "approved",
              "initial_candidate",
          ):
              raise RuntimeError(
                  "Candidate has not passed Quality Gate"
              )

          if candidate.tags.get("dataset_scope") != "production":
              raise RuntimeError(
                  "Production dataset approval is missing"
              )

          client.set_registered_model_alias(
              name=model_name,
              alias="Champion",
              version=model_version,
          )

          print(
              f"Champion updated to version {model_version}"
          )
          PY

          echo "=== Release completed successfully ==="

          cleanup
          PORT_FORWARD_PID=""

          trap - EXIT

      - name: Write release summary
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "## Taxi Model Release"
            echo ""
            echo "- Model: ${MODEL_NAME}"
            echo "- Version: ${MODEL_VERSION}"
            echo "- Git SHA: ${GITHUB_SHA}"
            echo "- Image: ${IMAGE_TAG}"
            echo "- Smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop test container
        if: always()
        run: |
          docker rm -f taxi-prediction-test || true
