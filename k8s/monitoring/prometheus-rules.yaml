
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: taxi-prediction-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app: taxi-prediction

spec:
  groups:
    - name: taxi-prediction.rules
      rules:

        - alert: TaxiPredictionHighErrorRate
          expr: |
            (
              sum(
                rate(
                  http_requests_total{
                    namespace="taxi-ml",
                    handler="/predict",
                    status=~"5.."
                  }[5m]
                )
              )
              /
              clamp_min(
                sum(
                  rate(
                    http_requests_total{
                      namespace="taxi-ml",
                      handler="/predict"
                    }[5m]
                  )
                ),
                1e-9
              )
            ) > 0.05
            and
            sum(
              rate(
                http_requests_total{
                  namespace="taxi-ml",
                  handler="/predict"
                }[5m]
              )
            ) > 0.1

          for: 5m

          labels:
            severity: warning
            service: taxi-prediction

          annotations:
            summary: "High HTTP 5xx error rate"
            description: >-
              More than 5% of /predict requests
              have returned HTTP 5xx for 5 minutes.

        - alert: TaxiPredictionNoAvailableReplicas
          expr: |
            kube_deployment_status_replicas_available{
              namespace="taxi-ml",
              deployment="taxi-prediction"
            } == 0

          for: 2m

          labels:
            severity: critical
            service: taxi-prediction

          annotations:
            summary: "Taxi Prediction has no available replicas"
            description: >-
              Taxi Prediction Deployment has had
              zero available replicas for 2 minutes.
