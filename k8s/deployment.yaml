
apiVersion: apps/v1
kind: Deployment

metadata:
  name: taxi-prediction
  namespace: taxi-ml
  labels:
    app: taxi-prediction

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: taxi-prediction

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: taxi-prediction

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: taxi-api

          # Replace with published image
          image: cr.yandex/crpkop984k0letp5qrmj/taxi-prediction:model-v1-4329cb625432
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "2Gi"
