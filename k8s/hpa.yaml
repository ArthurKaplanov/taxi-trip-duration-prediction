
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: taxi-prediction-hpa
  namespace: taxi-ml

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taxi-prediction

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

    scaleDown:
      stabilizationWindowSeconds: 120
